<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sun Date 🌞</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Screen 1: Welcome -->
  <section id="screen-welcome" class="screen active">
    <div class="sun"></div>
    <div class="container">
      <h1>Hey Bunbiee ☀️</h1>
      <p>I have a little surprise for you...</p>
      <button class="btn btn-primary" onclick="showScreen('screen-memory-1')">What?</button>
    </div>
  </section>

  <!-- Screen 2a: Memory / Teaser Part 1 -->
  <section id="screen-memory-1" class="screen">
    <div class="container">
      <h2>if you are free tom I have a</h2>
      <button class="btn btn-primary" onclick="showScreen('screen-memory-2')">a what???</button>
    </div>
  </section>

  <!-- Screen 2b: Memory / Teaser Part 2 -->
  <section id="screen-memory-2" class="screen">
    <div class="container">
      <h2>but first Happy Girlfiend day!!!!🎉</h2>
      <button class="btn btn-primary" onclick="startLoading()">okay!</button>
    </div>
  </section>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="overlay hidden">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>Hmm... let me cook something...</p>
    </div>
  </div>

  <!-- Screen 3: The Ask -->
  <section id="screen-ask" class="screen">
    <div class="container">
      <h2>Bunbiee, will you go on a sun date with me<br /><span class="date-highlight">tomorrow!!!!?</span></h2>
      <div class="ask-buttons">
        <button id="btn-yes" class="btn btn-yes" onclick="handleYes()">Yes</button>
        <button id="btn-no" class="btn btn-no" onmouseenter="handleNoHover()" ontouchstart="handleNoHover()" onclick="handleNoClick()">No</button>
      </div>
    </div>
  </section>

  <!-- Screen 3b: Silly Excuse -->
  <div id="screen-excuse" class="overlay hidden">
    <div class="excuse-content">
      <p id="excuse-text" class="excuse-text"></p>
      <button class="btn btn-primary" onclick="hideExcuse()">Okay okay...</button>
    </div>
  </div>

  <!-- Screen 4: Celebration -->
  <section id="screen-celebration" class="screen">
    <div class="sun"></div>
    <div class="container">
      <h1>YAY! 🎉</h1>
      <p>I miss you so much bunbieee, why u not contacting me :(</p>
      <p class="celebration-sub">hehe</p>
      <button class="btn btn-primary" onclick="showScreen('screen-welcome')">Replay</button>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
